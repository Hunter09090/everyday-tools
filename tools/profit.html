<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profit & Loss — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:720px;margin:auto;padding:70px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px}.dark .box{background:#111621}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid #dfe2eb;border-radius:12px;font:inherit;background:transparent;color:inherit}button{margin-top:20px;padding:13px 20px;border:0;border-radius:12px;background:#6258ff;color:#fff;font-weight:800}.result{margin-top:24px;padding:20px;border-radius:16px;background:#f1f0ff}.back{color:#6258ff;text-decoration:none;font-weight:700}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">CALCULATOR</span><h1>📈 Profit & Loss</h1><label>Cost price</label><input id="c" type="number" min="0"><label>Selling price</label><input id="s" type="number" min="0"><button onclick="calc()">Calculate</button><div id="r" class="result" hidden></div></div></main><script>function calc(){const c=+document.getElementById('c').value,s=+document.getElementById('s').value;if(c<=0||s<0)return;const x=s-c,p=Math.abs(x)/c*100;r.hidden=false;r.innerHTML=x>=0?`<b>Profit: ${x.toFixed(2)}</b><br>Profit percentage: ${p.toFixed(2)}%`:`<b>Loss: ${Math.abs(x).toFixed(2)}</b><br>Loss percentage: ${p.toFixed(2)}%`}</script></body></html>
