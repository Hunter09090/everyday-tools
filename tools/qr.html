<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Generator — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:720px;margin:auto;padding:60px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px;text-align:center}.dark .box{background:#111621}input{width:100%;padding:14px;border:1px solid #dfe2eb;border-radius:11px;font:inherit;background:transparent;color:inherit}button{margin-top:15px;padding:12px 18px;border:0;border-radius:11px;background:#6258ff;color:#fff;font-weight:800;cursor:pointer}.qr{margin:25px auto;min-height:220px;display:grid;place-items:center}.back{color:#6258ff;text-decoration:none;font-weight:700}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">UTILITY</span><h1>▦ QR Code Generator</h1><p>Enter text or a URL to create a QR code.</p><input id="v" placeholder="https://example.com"><button onclick="make()">Generate QR</button><div id="q" class="qr"></div></div></main><script>function make(){const x=v.value.trim();if(!x)return;q.innerHTML=`<img alt="QR Code" width="220" height="220" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(x)}">`}</script></body></html>
