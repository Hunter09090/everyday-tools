<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free live currency converter with common world currencies."><title>Currency Converter — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:760px;margin:auto;padding:60px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px;box-shadow:0 18px 50px rgba(25,30,55,.07)}.dark .box{background:#111621;border-color:#252c3d}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,select{width:100%;padding:14px;border:1px solid #dfe2eb;border-radius:12px;font:inherit;background:transparent;color:inherit}button{margin-top:20px;padding:13px 20px;border:0;border-radius:12px;background:#6258ff;color:#fff;font-weight:800;cursor:pointer}.swap{background:transparent;color:#6258ff;border:1px solid #dfe2eb;margin-left:7px}.result{margin-top:25px;padding:22px;border-radius:17px;background:#f1f0ff}.dark .result{background:#1b1d38}.amount{font-size:32px;font-weight:800}.muted{font-size:12px;color:#818798;margin-top:7px}.back{color:#6258ff;text-decoration:none;font-weight:700}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="../index.html">← Back to Everyday Tools</a><div class="box"><span class="label">CONVERTER</span><h1>💱 Currency Converter</h1><p>Convert currencies using current exchange-rate data.</p><label>Amount</label><input id="amount" type="number" min="0.01" step="any" value="1"><div class="row"><div><label>From</label><select id="from"><option>USD</option><option>BDT</option><option>EUR</option><option>GBP</option><option>INR</option><option>AED</option><option>SAR</option><option>CAD</option><option>AUD</option><option>JPY</option><option>CNY</option></select></div><div><label>To</label><select id="to"><option>BDT</option><option>USD</option><option>EUR</option><option>GBP</option><option>INR</option><option>AED</option><option>SAR</option><option>CAD</option><option>AUD</option><option>JPY</option><option>CNY</option></select></div></div><button onclick="convert()">Convert</button><button class="swap" onclick="swapCurrencies()">⇄ Swap</button><div id="result" class="result" hidden></div></div></main><script>const names={USD:'US Dollar',BDT:'Bangladeshi Taka',EUR:'Euro',GBP:'British Pound',INR:'Indian Rupee',AED:'UAE Dirham',SAR:'Saudi Riyal',CAD:'Canadian Dollar',AUD:'Australian Dollar',JPY:'Japanese Yen',CNY:'Chinese Yuan'};async function convert(){const a=Number(amount.value),f=from.value,t=to.value;if(!a||a<=0)return;result.hidden=false;result.innerHTML='Fetching current rate…';try{const url=`https://api.frankfurter.app/latest?amount=${encodeURIComponent(a)}&from=${f}&to=${t}`;const res=await fetch(url);if(!res.ok)throw Error();const data=await res.json();const value=data.rates[t];const rate=value/a;result.innerHTML=`<div class="amount">${value.toLocaleString(undefined,{maximumFractionDigits:4})} ${t}</div><div class="muted">1 ${f} = ${rate.toLocaleString(undefined,{maximumFractionDigits:6})} ${t}<br>${a.toLocaleString()} ${f} → ${value.toLocaleString(undefined,{maximumFractionDigits:4})} ${t}</div>`}catch(e){result.innerHTML='<b>Could not load the exchange rate.</b><div class="muted">Please check your internet connection and try again.</div>'}}function swapCurrencies(){const x=from.value;from.value=to.value;to.value=x;convert()}</script></body></html>
