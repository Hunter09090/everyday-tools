<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Convert currencies using the latest available exchange-rate data."><meta name="theme-color" content="#6258ff"><title>Currency Converter — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:760px;margin:auto;padding:60px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px;box-shadow:0 18px 50px rgba(25,30,55,.07)}.dark .box{background:#111621;border-color:#252c3d}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,select{width:100%;padding:14px;border:1px solid #dfe2eb;border-radius:12px;font:inherit;background:transparent;color:inherit}button{margin-top:20px;padding:13px 20px;border:0;border-radius:12px;background:#6258ff;color:#fff;font-weight:800;cursor:pointer}.swap{background:transparent;color:#6258ff;border:1px solid #dfe2eb;margin-left:7px}.result{margin-top:25px;padding:22px;border-radius:17px;background:#f1f0ff}.dark .result{background:#1b1d38}.amount{font-size:32px;font-weight:800}.muted{font-size:12px;color:#818798;margin-top:7px}.back{color:#6258ff;text-decoration:none;font-weight:700}.popular{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.popular button{margin:0;padding:7px 10px;background:transparent;color:#6258ff;border:1px solid #dfe2eb;font-size:11px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="../index.html">← Back to Everyday Tools</a><div class="box"><span class="label">CONVERTER</span><h1>💱 Currency Converter</h1><p>Convert using the latest available exchange-rate data.</p><label>Amount</label><input id="amount" type="number" min="0" step="any" value="1"><div class="row"><div><label>From</label><select id="from"></select></div><div><label>To</label><select id="to"></select></div></div><div class="popular"><button data-pair="USD,BDT">USD → BDT</button><button data-pair="EUR,BDT">EUR → BDT</button><button data-pair="GBP,BDT">GBP → BDT</button><button data-pair="USD,EUR">USD → EUR</button></div><button onclick="convert()">Convert</button><button class="swap" onclick="swapCurrencies()">⇄ Swap</button><div id="result" class="result" hidden></div></div></main><script>const popular=['USD','BDT','EUR','GBP','INR','AED','SAR','CAD','AUD','JPY','CNY'];const names={USD:'US Dollar',BDT:'Bangladeshi Taka',EUR:'Euro',GBP:'British Pound',INR:'Indian Rupee',AED:'UAE Dirham',SAR:'Saudi Riyal',CAD:'Canadian Dollar',AUD:'Australian Dollar',JPY:'Japanese Yen',CNY:'Chinese Yuan'};let currencies={};async function loadCurrencies(){try{const res=await fetch('https://api.frankfurter.dev/v2/currencies');if(!res.ok)throw Error();currencies=await res.json()}catch(e){currencies=Object.fromEntries(popular.map(c=>[c,{name:names[c]}]))}const all=Object.keys(currencies).sort();from.innerHTML=all.map(c=>'<option value="'+c+'">'+c+' — '+(currencies[c].name||'')+'</option>').join('');to.innerHTML=all.map(c=>'<option value="'+c+'">'+c+' — '+(currencies[c].name||'')+'</option>').join('');from.value='USD';to.value='BDT'}async function convert(){const a=Number(amount.value),f=from.value,t=to.value;if(!Number.isFinite(a)||a<0){result.hidden=false;result.innerHTML='<b>Enter a valid amount.</b>';return}result.hidden=false;result.innerHTML='Fetching latest available rate…';try{if(f===t){result.innerHTML='<div class="amount">'+a.toLocaleString()+' '+t+'</div><div class="muted">1 '+f+' = 1 '+t+'<br>Same currency — no conversion needed.</div>';return}const res=await fetch('https://api.frankfurter.dev/v2/rate/'+encodeURIComponent(f)+'/'+encodeURIComponent(t));if(!res.ok)throw Error();const data=await res.json(),value=a*data.rate;result.innerHTML='<div class="amount">'+value.toLocaleString(undefined,{maximumFractionDigits:6})+' '+t+'</div><div class="muted">1 '+f+' = '+data.rate.toLocaleString(undefined,{maximumFractionDigits:8})+' '+t+'<br>'+a.toLocaleString()+' '+f+' → '+value.toLocaleString(undefined,{maximumFractionDigits:6})+' '+t+'<br>Rate date: '+data.date+' · Latest available rate</div>';localStorage.setItem('currency:last',JSON.stringify({a,f,t,value,rate:data.rate,date:data.date}))}catch(e){result.innerHTML='<b>Could not load the exchange rate.</b><div class="muted">Check your connection and try again.</div>'}}function swapCurrencies(){const x=from.value;from.value=to.value;to.value=x;convert()}document.addEventListener('click',e=>{const b=e.target.closest('[data-pair]');if(b){const [f,t]=b.dataset.pair.split(',');from.value=f;to.value=t;convert()}});loadCurrencies();</script></body></html>
