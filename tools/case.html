<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Case Converter — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:800px;margin:auto;padding:60px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px}.dark .box{background:#111621}textarea{width:100%;min-height:260px;padding:15px;border:1px solid #dfe2eb;border-radius:12px;font:inherit;background:transparent;color:inherit;resize:vertical}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{padding:11px 15px;border:0;border-radius:10px;background:#6258ff;color:#fff;font-weight:700;cursor:pointer}.back{color:#6258ff;text-decoration:none;font-weight:700}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">TEXT TOOL</span><h1>Aa Case Converter</h1><textarea id="t" placeholder="Type or paste text…"></textarea><div class="buttons"><button onclick="t.value=t.value.toUpperCase()">UPPERCASE</button><button onclick="t.value=t.value.toLowerCase()">lowercase</button><button onclick="t.value=t.value.replace(/\b\w/g,x=>x.toUpperCase())">Title Case</button><button onclick="t.value=''">Clear</button></div></div></main></body></html>
