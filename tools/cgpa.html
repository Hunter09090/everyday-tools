<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPA / CGPA Calculator — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:760px;margin:auto;padding:60px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px}.dark .box{background:#111621;border-color:#252c3d}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}input{width:100%;padding:13px;border:1px solid #dfe2eb;border-radius:10px;font:inherit;background:transparent;color:inherit}button{padding:12px 18px;border:0;border-radius:11px;background:#6258ff;color:#fff;font-weight:800;cursor:pointer;margin-top:10px}.result{margin-top:20px;padding:18px;border-radius:15px;background:#f1f0ff}.back{color:#6258ff;text-decoration:none;font-weight:700}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">CALCULATOR</span><h1>🎓 GPA / CGPA Calculator</h1><p>Enter grade points and credits for each course.</p><div id="rows"><div class="row"><input type="number" class="g" min="0" max="4" step="0.01" placeholder="Grade point"><input type="number" class="c" min="0" step="0.5" placeholder="Credit"></div></div><button onclick="add()">+ Add course</button> <button onclick="calc()">Calculate</button><div id="r" class="result" hidden></div></div></main><script>function add(){rows.insertAdjacentHTML('beforeend','<div class="row"><input type="number" class="g" min="0" max="4" step="0.01" placeholder="Grade point"><input type="number" class="c" min="0" step="0.5" placeholder="Credit"></div>')}function calc(){let gs=[...document.querySelectorAll('.g')],cs=[...document.querySelectorAll('.c')],p=0,t=0;gs.forEach((x,i)=>{let g=+x.value,c=+cs[i].value;if(g>=0&&c>0){p+=g*c;t+=c}});if(!t)return;r.hidden=false;r.innerHTML=`<b>GPA / CGPA: ${(p/t).toFixed(2)}</b><br>Total credits: ${t}`}</script></body></html>
