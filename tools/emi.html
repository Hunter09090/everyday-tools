<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMI Calculator — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:700px;margin:auto;padding:50px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:28px}.dark .box{background:#111621;border-color:#252c3d}input{width:100%;padding:13px;margin:6px 0 12px;border:1px solid #dfe2eb;border-radius:11px;background:transparent;color:inherit}button{padding:12px 18px;background:#6258ff;color:#fff;border:0;border-radius:11px;font-weight:800}.result{margin-top:20px;padding:20px;background:#f1f0ff;border-radius:15px}.dark .result{background:#1b1d38}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">CALCULATOR</span><h1>💳 EMI Calculator</h1><label>Loan amount</label><input id="p" type="number" value="500000"><label>Annual interest (%)</label><input id="r" type="number" step=".01" value="10"><label>Tenure (months)</label><input id="n" type="number" value="60"><button onclick="calc()">Calculate EMI</button><div id="result" class="result">—</div></div></main><script>function calc(){const P=Number(p.value),m=Number(r.value)/1200,N=Number(n.value);if(P<=0||N<=0||r.value<0)return result.textContent='Enter valid values.';const e=m?P*m*Math.pow(1+m,N)/(Math.pow(1+m,N)-1):P/N;result.innerHTML='<b>Monthly EMI: '+e.toLocaleString(undefined,{maximumFractionDigits:2})+'</b><br>Total payment: '+(e*N).toLocaleString(undefined,{maximumFractionDigits:2})+'<br>Total interest: '+(e*N-P).toLocaleString(undefined,{maximumFractionDigits:2})}</script></body></html>
