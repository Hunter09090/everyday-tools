<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Days Until Calculator — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:600px;margin:auto;padding:60px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:28px;text-align:center}.dark .box{background:#111621;border-color:#252c3d}input,button{width:100%;padding:14px;border:1px solid #dfe2eb;border-radius:12px;background:transparent;color:inherit;font:inherit}button{margin-top:15px;background:#6258ff;color:#fff;border:0;font-weight:800}.big{font-size:48px;font-weight:900;margin:25px 0}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">UTILITY</span><h1>⏳ Days Until</h1><input id="target" type="date"><button onclick="calc()">Calculate</button><div id="result" class="big">—</div></div></main><script>target.value=new Date().toISOString().slice(0,10);function calc(){const d=new Date(target.value+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);const x=Math.ceil((d-n)/86400000);result.textContent=x>0?x+' day(s) left':x===0?'Today!':Math.abs(x)+' day(s) ago'}</script></body></html>
