<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Area Calculator — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:700px;margin:auto;padding:50px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:28px}.dark .box{background:#111621;border-color:#252c3d}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{width:100%;padding:13px;margin:6px 0 12px;border:1px solid #dfe2eb;border-radius:11px;background:transparent;color:inherit}button{padding:12px 18px;background:#6258ff;color:#fff;border:0;border-radius:11px;font-weight:800}.result{margin-top:20px;padding:20px;background:#f1f0ff;border-radius:15px;font-size:22px;font-weight:800}.dark .result{background:#1b1d38}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">CALCULATOR</span><h1>📐 Area Calculator</h1><select id="shape"><option value="rect">Rectangle</option><option value="tri">Triangle</option><option value="circle">Circle</option></select><div class="row"><input id="a" type="number" step="any" placeholder="Length / base"><input id="b" type="number" step="any" placeholder="Width / height"></div><button onclick="calc()">Calculate area</button><div id="result" class="result">—</div></div></main><script>function calc(){const A=Number(a.value),B=Number(b.value);if(A<=0||(shape.value!=='circle'&&B<=0))return result.textContent='Enter valid dimensions.';let x=shape.value==='rect'?A*B:shape.value==='tri'?A*B/2:Math.PI*A*A;result.textContent=x.toLocaleString(undefined,{maximumFractionDigits:6})+' square units'}</script></body></html>
