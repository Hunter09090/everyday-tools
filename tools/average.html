<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Average Calculator — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:700px;margin:auto;padding:50px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:28px}.dark .box{background:#111621;border-color:#252c3d}textarea{width:100%;min-height:160px;padding:14px;border:1px solid #dfe2eb;border-radius:12px;background:transparent;color:inherit;font:inherit}button{margin-top:15px;padding:12px 18px;background:#6258ff;color:#fff;border:0;border-radius:11px;font-weight:800}.result{margin-top:20px;font-size:22px;font-weight:800}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">CALCULATOR</span><h1>📊 Average Calculator</h1><textarea id="nums" placeholder="Enter numbers separated by commas or spaces">10, 20, 30, 40</textarea><button onclick="calc()">Calculate</button><div id="result" class="result">—</div></div></main><script>function calc(){const a=nums.value.split(/[\s,]+/).map(Number).filter(Number.isFinite);if(!a.length)return result.textContent='Enter numbers.';const sum=a.reduce((x,y)=>x+y,0);result.innerHTML='Average: '+(sum/a.length).toFixed(4)+'<br>Count: '+a.length+'<br>Sum: '+sum}</script></body></html>
