<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Encode and decode URL text safely in your browser."><title>URL Encoder & Decoder — Everyday Tools</title><link rel="stylesheet" href="../style.css"></head><body><main style="max-width:800px;margin:auto;padding:50px 20px"><a class="back" href="../index.html">← Back</a><div class="tool-page"><span class="label">TEXT</span><h1>🔗 URL Encoder / Decoder</h1><textarea id="text" placeholder="Paste text or URL…" style="width:100%;min-height:260px;padding:15px;border:1px solid #dfe2eb;border-radius:12px;background:transparent;color:inherit"></textarea><button onclick="text.value=encodeURIComponent(text.value)">Encode</button><button onclick="decodeText()">Decode</button><button onclick="text.value=''">Clear</button><p id="msg"></p></div></main><script>function decodeText(){try{text.value=decodeURIComponent(text.value);msg.textContent='Decoded ✓'}catch(e){msg.textContent='Invalid encoded text.'}}</script></body></html>
