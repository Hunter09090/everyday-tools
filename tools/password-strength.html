<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Check password strength locally in your browser."><title>Password Strength Checker — Everyday Tools</title><link rel="stylesheet" href="../style.css"></head><body><main style="max-width:650px;margin:auto;padding:50px 20px"><a class="back" href="../index.html">← Back</a><div class="tool-page"><span class="label">UTILITY</span><h1>🛡️ Password Strength Checker</h1><p>Your password is evaluated locally; it is not sent to a server.</p><input id="pw" type="password" placeholder="Enter password" style="width:100%;padding:14px;border:1px solid #dfe2eb;border-radius:12px;background:transparent;color:inherit"><div style="height:10px;background:#e8eaf1;border-radius:10px;margin:20px 0"><div id="bar" style="height:100%;width:0;border-radius:10px;background:#6258ff;transition:.2s"></div></div><h2 id="result">Type a password.</h2><p id="tips"></p></div></main><script>pw.oninput=()=>{const s=pw.value;let score=0;if(s.length>=8)score++;if(s.length>=12)score++;if(/[a-z]/.test(s))score++;if(/[A-Z]/.test(s))score++;if(/\d/.test(s))score++;if(/[^A-Za-z0-9]/.test(s))score++;bar.style.width=(score/6*100)+'%';result.textContent=!s?'Type a password.':score<=2?'Weak':score<=4?'Medium':'Strong';tips.textContent=s.length<12?'Tip: use 12+ characters with upper/lowercase, numbers and symbols.':''}</script></body></html>
