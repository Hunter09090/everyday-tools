<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit Converter — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:760px;margin:auto;padding:60px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px}.dark .box{background:#111621;border-color:#252c3d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}select,input{width:100%;padding:13px;border:1px solid #dfe2eb;border-radius:10px;font:inherit;background:transparent;color:inherit;margin:7px 0 14px}button{padding:12px 18px;border:0;border-radius:11px;background:#6258ff;color:#fff;font-weight:800;cursor:pointer}.result{margin-top:18px;font-size:25px;font-weight:800;color:#6258ff}.back{color:#6258ff;text-decoration:none;font-weight:700}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">CONVERTER</span><h1>⇄ Unit Converter</h1><select id="type" onchange="fill()"><option value="length">Length</option><option value="weight">Weight</option><option value="temp">Temperature</option></select><div class="grid"><div><label>From</label><select id="from"></select></div><div><label>To</label><select id="to"></select></div></div><input id="v" type="number" placeholder="Enter value"><button onclick="convert()">Convert</button><div id="r" class="result">—</div></div></main><script>const units={length:{meter:1,kilometer:1000,centimeter:.01,mile:1609.344,foot:.3048,inch:.0254},weight:{kilogram:1,gram:.001,pound:.45359237,ounce:.0283495231},temp:{C:'C',F:'F',K:'K'}};function fill(){let u=units[type.value];from.innerHTML=Object.keys(u).map(x=>`<option>${x}</option>`).join('');to.innerHTML=from.innerHTML;convert()}fill();function convert(){let val=+v.value;if(!isFinite(val)){r.textContent='—';return}let u=units[type.value],a=from.value,b=to.value,out;if(type.value==='temp'){let c=a==='C'?val:a==='F'?(val-32)*5/9:val-273.15;out=b==='C'?c:b==='F'?c*9/5+32:c+273.15}else out=val*u[a]/u[b];r.textContent=out.toLocaleString(undefined,{maximumFractionDigits:8})+' '+b}</script></body></html>
