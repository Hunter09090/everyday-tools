<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discount Calculator — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:720px;margin:auto;padding:70px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px}.dark .box{background:#111621}.error{color:#c33}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid #dfe2eb;border-radius:12px;font:inherit;background:transparent;color:inherit}button{margin-top:20px;padding:13px 20px;border:0;border-radius:12px;background:#6258ff;color:#fff;font-weight:800}.result{margin-top:24px;padding:20px;border-radius:16px;background:#f1f0ff}.back{color:#6258ff;text-decoration:none;font-weight:700}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">CALCULATOR</span><h1>🏷️ Discount Calculator</h1><label>Original price</label><input id="price" type="number" min="0" step="any"><label>Discount (%)</label><input id="disc" type="number" min="0" max="100" step="any"><button onclick="calc()">Calculate</button><div id="r" class="result" hidden></div></div></main><script>function calc(){const p=Number(price.value),d=Number(disc.value);r.hidden=false;if(!Number.isFinite(p)||!Number.isFinite(d)||p<0||d<0||d>100)return r.innerHTML='<span class="error">Enter a price ≥ 0 and discount from 0–100%.</span>';const save=p*d/100;r.innerHTML='You save <b>'+save.toFixed(2)+'</b><br>Final price <b>'+(p-save).toFixed(2)+'</b>'}</script></body></html>
