<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Free Age Calculator"><title>Age Calculator — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:720px;margin:auto;padding:70px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px;box-shadow:0 18px 50px #252a4012}.dark .box{background:#111621;border-color:#252c3d}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid #dfe2eb;border-radius:12px;font:inherit;background:transparent;color:inherit}button{margin-top:20px;padding:13px 20px;border:0;border-radius:12px;background:#6258ff;color:white;font-weight:800;cursor:pointer}.result{margin-top:24px;padding:20px;border-radius:16px;background:#f1f0ff}.dark .result{background:#1b1d38}.back{display:inline-block;margin-bottom:25px;color:#6258ff;text-decoration:none;font-weight:700}</style></head><body><main><a class="back" href="../index.html">← Back to Everyday Tools</a><div class="box"><span class="label">CALCULATOR</span><h1>🎂 Age Calculator</h1><p>Find your exact age in years, months and days.</p><label for="dob">Date of birth</label><input id="dob" type="date"><button onclick="calc()">Calculate Age</button><div id="result" class="result" hidden></div></div></main><script>function calc(){const d=new Date(document.getElementById('dob').value+'T00:00:00'),now=new Date();if(!document.getElementById('dob').value||d>now)return;let y=now.getFullYear()-d.getFullYear(),m=now.getMonth()-d.getMonth(),day=now.getDate()-d.getDate();if(day<0){m--;day+=new Date(now.getFullYear(),now.getMonth(),0).getDate()}if(m<0){y--;m+=12}const r=document.getElementById('result');r.hidden=false;r.innerHTML=`<strong>Your age is</strong><br><span style="font-size:28px;font-weight:800">${y} years, ${m} months, ${day} days</span>`}</script></body></html>
