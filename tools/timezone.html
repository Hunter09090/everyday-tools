<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Zone Converter — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:700px;margin:auto;padding:50px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:28px}.dark .box{background:#111621;border-color:#252c3d}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:700;display:block;margin:12px 0 6px}input,select,button{width:100%;padding:13px;border:1px solid #dfe2eb;border-radius:11px;background:transparent;color:inherit;font:inherit}button{margin-top:18px;background:#6258ff;color:#fff;border:0;font-weight:800}.result{margin-top:20px;padding:20px;background:#f1f0ff;border-radius:15px;font-weight:700}.dark .result{background:#1b1d38}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">UTILITY</span><h1>🌍 Time Zone Converter</h1><div class="row"><div><label>Date & time</label><input id="dt" type="datetime-local"></div><div><label>From time zone</label><select id="from"><option>UTC</option><option>Asia/Dhaka</option><option>Asia/Kolkata</option><option>Asia/Dubai</option><option>Europe/London</option><option>Europe/Berlin</option><option>America/New_York</option><option>America/Los_Angeles</option><option>Asia/Tokyo</option><option>Australia/Sydney</option></select></div></div><label>To time zone</label><select id="to"><option>Asia/Dhaka</option><option>UTC</option><option>Asia/Kolkata</option><option>Asia/Dubai</option><option>Europe/London</option><option>Europe/Berlin</option><option>America/New_York</option><option>America/Los_Angeles</option><option>Asia/Tokyo</option><option>Australia/Sydney</option></select><button onclick="convert()">Convert</button><div id="result" class="result">—</div></div></main><script>dt.value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);function offset(zone,date){const s=new Intl.DateTimeFormat('en-US',{timeZone:zone,timeZoneName:'longOffset',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(date).find(x=>x.type==='timeZoneName')?.value||'GMT';const m=s.match(/GMT([+-])(\d\d):?(\d\d)?/);return m?(m[1]==='-'?-1:1)*(Number(m[2])*60+Number(m[3]||0)):0}function convert(){const d=new Date(dt.value),f=offset(from.value,d),t=offset(to.value,d),u=new Date(d.getTime()+(t-f)*60000);result.textContent=new Intl.DateTimeFormat('en-GB',{dateStyle:'full',timeStyle:'short',timeZone:to.value}).format(u)+' ('+to.value+')'}</script></body></html>
