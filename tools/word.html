<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Counter — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:800px;margin:auto;padding:60px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px}.dark .box{background:#111621}textarea{width:100%;min-height:260px;padding:15px;border:1px solid #dfe2eb;border-radius:12px;font:inherit;background:transparent;color:inherit;resize:vertical}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.stat{padding:15px;background:#f1f0ff;border-radius:12px;text-align:center}.stat b{display:block;font-size:22px}.back{color:#6258ff;text-decoration:none;font-weight:700}@media(max-width:600px){.stats{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">TEXT TOOL</span><h1>📝 Word Counter</h1><textarea id="text" placeholder="Start typing or paste your text…"></textarea><div class="stats"><div class="stat"><b id="w">0</b>Words</div><div class="stat"><b id="c">0</b>Characters</div><div class="stat"><b id="r">0 min</b>Reading time</div></div></div></main><script>text.addEventListener('input',()=>{let s=text.value.trim(),words=s?s.split(/\s+/).length:0;w.textContent=words;c.textContent=text.value.length;r.textContent=Math.max(0,Math.ceil(words/200))+' min'})</script></body></html>
