<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:720px;margin:auto;padding:60px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px}.dark .box{background:#111621}input[type=number],input[type=text]{width:100%;padding:14px;border:1px solid #dfe2eb;border-radius:11px;font:inherit;background:transparent;color:inherit;margin:10px 0}label{font-size:13px;font-weight:700}button{padding:12px 18px;border:0;border-radius:11px;background:#6258ff;color:#fff;font-weight:800;cursor:pointer}.result{margin:18px 0;padding:16px;background:#f1f0ff;border-radius:12px;word-break:break-all;font-weight:700}.back{color:#6258ff;text-decoration:none;font-weight:700}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">UTILITY</span><h1>🔐 Password Generator</h1><label>Length</label><input id="len" type="number" min="6" max="100" value="16"><label><input id="sym" type="checkbox" checked> Include symbols</label><div id="r" class="result">Click Generate</div><button onclick="generate()">Generate Password</button><button onclick="copyIt()">Copy</button></div></main><script>function generate(){let chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';if(sym.checked)chars+='!@#$%^&*()-_=+';let out='',a=new Uint32Array(+len.value||16);crypto.getRandomValues(a);for(let x of a)out+=chars[x%chars.length];r.textContent=out}function copyIt(){if(r.textContent&&r.textContent!=='Click Generate')navigator.clipboard?.writeText(r.textContent)}</script></body></html>
