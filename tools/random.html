<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Number — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:720px;margin:auto;padding:70px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px}.dark .box{background:#111621}input{width:100%;padding:14px;margin:8px 0 14px;border:1px solid #dfe2eb;border-radius:12px;font:inherit;background:transparent;color:inherit}button{padding:13px 20px;border:0;border-radius:12px;background:#6258ff;color:#fff;font-weight:800}.result{margin-top:24px;font-size:46px;font-weight:800;color:#6258ff}.back{color:#6258ff;text-decoration:none;font-weight:700}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">UTILITY</span><h1>🎲 Random Number</h1><p>Generate a random integer between two values.</p><label>Minimum</label><input id="min" type="number" value="1"><label>Maximum</label><input id="max" type="number" value="100"><br><button onclick="go()">Generate</button><div id="r" class="result">—</div></div></main><script>function go(){let a=+min.value,b=+max.value;if(a>b)[a,b]=[b,a];r.textContent=Math.floor(Math.random()*(b-a+1))+a}</script></body></html>
