<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Calculator — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:720px;margin:auto;padding:60px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px}.dark .box{background:#111621;border-color:#252c3d}label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #dfe2eb;border-radius:10px;font:inherit;background:transparent;color:inherit}button{padding:12px 18px;border:0;border-radius:11px;background:#6258ff;color:#fff;font-weight:800;cursor:pointer;margin-top:18px}.result{margin-top:20px;padding:18px;border-radius:15px;background:#f1f0ff}.back{color:#6258ff;text-decoration:none;font-weight:700}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">CALCULATOR</span><h1>📅 Date Calculator</h1><label>Start date</label><input id="a" type="date"><label>End date</label><input id="b" type="date"><button onclick="calc()">Calculate Difference</button><div id="r" class="result" hidden></div></div></main><script>function calc(){const a=new Date(document.getElementById('a').value),b=new Date(document.getElementById('b').value);if(isNaN(a)||isNaN(b))return;const days=Math.round(Math.abs(b-a)/86400000);r.hidden=false;r.innerHTML=`<b>${days.toLocaleString()} days</b><br>${Math.floor(days/7)} weeks and ${days%7} days`}</script></body></html>
