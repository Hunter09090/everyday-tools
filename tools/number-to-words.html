<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number to Words — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:700px;margin:auto;padding:50px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:28px}.dark .box{background:#111621;border-color:#252c3d}input,button{width:100%;padding:14px;border:1px solid #dfe2eb;border-radius:12px;background:transparent;color:inherit;font:inherit}button{margin-top:15px;background:#6258ff;color:#fff;border:0;font-weight:800}.result{margin-top:20px;padding:20px;background:#f1f0ff;border-radius:15px;font-size:20px}.dark .result{background:#1b1d38}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">UTILITY</span><h1>🔢 Number to Words</h1><input id="num" type="number" placeholder="Enter a number"><button onclick="convert()">Convert</button><div id="result" class="result">—</div></div></main><script>function under(n){const o=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],t=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];if(n<20)return o[n];if(n<100)return t[Math.floor(n/10)]+(n%10?' '+o[n%10]:'');if(n<1000)return o[Math.floor(n/100)]+' hundred'+(n%100?' '+under(n%100):'');return ''}function words(n){if(!Number.isInteger(n)||n<0||n>999999999)return 'Please enter a whole number from 0 to 999,999,999.';if(n===0)return 'zero';const units=[['million',1000000],['thousand',1000],['',1]];let s='';for(const [name,v] of units){const q=Math.floor(n/v);if(q){s+=(s?' ':'')+under(q)+(name?' '+name:'');n%=v}}return s}function convert(){result.textContent=words(Number(num.value))}</script></body></html>
