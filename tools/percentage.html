<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Percentage Calculator — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:720px;margin:auto;padding:70px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px}.dark .box{background:#111621;border-color:#252c3d}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid #dfe2eb;border-radius:12px;font:inherit;background:transparent;color:inherit}button{margin-top:20px;padding:13px 20px;border:0;border-radius:12px;background:#6258ff;color:white;font-weight:800}.result{margin-top:24px;padding:20px;border-radius:16px;background:#f1f0ff;font-size:24px;font-weight:800}.back{color:#6258ff;text-decoration:none;font-weight:700}.error{color:#c33;font-size:13px}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">CALCULATOR</span><h1>% Percentage Calculator</h1><p>Find what percentage one number is of another.</p><label>Percentage</label><input id="p" type="number" step="any" placeholder="e.g. 15"><label>Of</label><input id="n" type="number" step="any" placeholder="e.g. 500"><button onclick="calc()">Calculate</button><div id="r" class="result" hidden></div></div></main><script>function calc(){const p=Number(pInput.value),n=Number(nInput.value);r.hidden=false;if(!Number.isFinite(p)||!Number.isFinite(n))return r.innerHTML='<span class="error">Enter valid numbers.</span>';r.textContent=(p*n/100).toLocaleString(undefined,{maximumFractionDigits:8})}const pInput=document.getElementById('p'),nInput=document.getElementById('n'),r=document.getElementById('r');</script></body></html>
