<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tax Calculator — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:650px;margin:auto;padding:50px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:28px}.dark .box{background:#111621;border-color:#252c3d}input{width:100%;padding:13px;margin:6px 0 12px;border:1px solid #dfe2eb;border-radius:11px;background:transparent;color:inherit}button{padding:12px 18px;background:#6258ff;color:#fff;border:0;border-radius:11px;font-weight:800}.result{margin-top:20px;padding:20px;background:#f1f0ff;border-radius:15px}.dark .result{background:#1b1d38}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">CALCULATOR</span><h1>🧾 Tax Calculator</h1><p>Generic percentage-based estimate — not jurisdiction-specific tax advice.</p><label>Income / amount</label><input id="a" type="number" value="100000"><label>Tax rate (%)</label><input id="r" type="number" step=".01" value="10"><button onclick="calc()">Estimate tax</button><div id="result" class="result">—</div></div></main><script>function calc(){const A=Number(a.value),R=Number(r.value);if(A<0||R<0||R>100)return result.textContent='Enter valid values.';const t=A*R/100;result.innerHTML='<b>Estimated tax: '+t.toLocaleString(undefined,{maximumFractionDigits:2})+'</b><br>After tax: '+(A-t).toLocaleString(undefined,{maximumFractionDigits:2})}</script></body></html>
