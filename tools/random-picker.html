<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Random Name Picker — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:650px;margin:auto;padding:50px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:28px;text-align:center}.dark .box{background:#111621;border-color:#252c3d}textarea{width:100%;min-height:180px;padding:14px;border:1px solid #dfe2eb;border-radius:12px;background:transparent;color:inherit}button{padding:13px 20px;margin-top:15px;background:#6258ff;color:#fff;border:0;border-radius:12px;font-weight:800}.pick{font-size:34px;font-weight:900;margin:25px 0}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">UTILITY</span><h1>🎯 Random Name Picker</h1><textarea id="names" placeholder="One name per line">Akter
Rahim
Karim
Nadia</textarea><button onclick="pick()">Pick a winner</button><div id="result" class="pick">—</div></div></main><script>function pick(){const a=names.value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);result.textContent=a.length?a[Math.floor(Math.random()*a.length)]:'Add some names first.'}</script></body></html>
