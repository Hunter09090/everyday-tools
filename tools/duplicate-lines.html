<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Remove duplicate lines from text quickly."><title>Duplicate Line Remover — Everyday Tools</title><link rel="stylesheet" href="../style.css"></head><body><main style="max-width:800px;margin:auto;padding:50px 20px"><a class="back" href="../index.html">← Back</a><div class="tool-page"><span class="label">TEXT</span><h1>🧹 Duplicate Line Remover</h1><textarea id="text" placeholder="One item per line…" style="width:100%;min-height:300px;padding:15px;border:1px solid #dfe2eb;border-radius:12px;background:transparent;color:inherit"></textarea><button onclick="clean(false)">Remove duplicates</button><button onclick="clean(true)">Remove + sort</button><button onclick="text.value=''">Clear</button></div></main><script>function clean(sort){let a=text.value.split(/\r?\n/).filter(x=>x.trim());a=[...new Set(a)];if(sort)a.sort((x,y)=>x.localeCompare(y));text.value=a.join('\n')}</script></body></html>
