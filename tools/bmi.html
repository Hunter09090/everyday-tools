<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMI Calculator — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:720px;margin:auto;padding:70px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px}.dark .box{background:#111621}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.error{color:#c33}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:14px;border:1px solid #dfe2eb;border-radius:12px;font:inherit;background:transparent;color:inherit}button{margin-top:20px;padding:13px 20px;border:0;border-radius:12px;background:#6258ff;color:#fff;font-weight:800}.result{margin-top:24px;padding:20px;border-radius:16px;background:#f1f0ff}.back{color:#6258ff;text-decoration:none;font-weight:700}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">CALCULATOR</span><h1>⚖️ BMI Calculator</h1><p>Enter your weight and height.</p><div class="grid"><div><label>Weight (kg)</label><input id="w" type="number" min="1" step="any"></div><div><label>Height (cm)</label><input id="h" type="number" min="30" step="any"></div></div><button onclick="calc()">Calculate BMI</button><div id="r" class="result" hidden></div></div></main><script>const unit=document.getElementById('unit'),cmBox=document.getElementById('cmBox'),ftBox=document.getElementById('ftBox');unit.onchange=()=>{const ft=unit.value==='ft';cmBox.hidden=ft;ftBox.hidden=!ft};function calc(){const w=Number(document.getElementById('w').value);let h;if(unit.value==='cm'){h=Number(document.getElementById('h').value)}else{const f=Number(document.getElementById('feet').value),i=Number(document.getElementById('inch').value||0);if(!Number.isFinite(f)||!Number.isFinite(i)||f<1||f>9||i<0||i>=12){r.hidden=false;r.innerHTML='<span class="error">Enter valid feet and inches.</span>';return}h=(f*12+i)*2.54}const r=document.getElementById('r');r.hidden=false;if(!Number.isFinite(w)||!Number.isFinite(h)||w<=0||h<50||h>300)return r.innerHTML='<span class="error">Enter a valid weight and height.</span>';const bmi=w/((h/100)**2);let c=bmi<18.5?'Underweight':bmi<25?'Healthy range':bmi<30?'Overweight':'Obesity';r.innerHTML='<strong>BMI: '+bmi.toFixed(1)+'</strong><br>'+c+'<br><small>BMI is a screening measure, not a diagnosis.</small>'}</script></body></html>
