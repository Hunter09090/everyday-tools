<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Calculate BMI using centimetres or feet and inches.">
<title>BMI Calculator — ToolVerse</title>
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../toolverse.css">
<style>
main{max-width:760px;margin:auto;padding:55px 20px}.box{background:var(--tv-panel,#111621);border:1px solid var(--tv-line,#252c40);border-radius:24px;padding:clamp(20px,5vw,32px)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.error{color:#ff858b}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input,select{width:100%;padding:13px;border:1px solid var(--tv-line,#30374a);border-radius:12px;font:inherit;background:var(--tv-bg,#090b12);color:inherit}button{margin-top:20px;padding:13px 20px;border:0;border-radius:12px;background:#8c7aff;color:#111;font-weight:800;cursor:pointer}.result{margin-top:24px;padding:20px;border-radius:16px;background:#8c7aff18;border:1px solid #8c7aff44;line-height:1.8}.back{display:inline-block;margin-bottom:20px;color:#a99aff;text-decoration:none;font-weight:700}.helper{font-size:12px;color:var(--tv-muted,#a0a8bd)}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head>
<body class="dark"><main><a class="back" href="../index.html">← Back to ToolVerse</a><div class="box"><span class="label">CALCULATOR</span><h1>⚖️ BMI Calculator</h1><p>Calculate your body mass index. BMI is a screening measure, not a diagnosis.</p>
<label for="w">Weight (kg)</label><input id="w" type="number" min="1" max="500" step="any" inputmode="decimal" placeholder="e.g. 60">
<label for="unit">Height unit</label><select id="unit"><option value="cm">Centimetres (cm)</option><option value="ft">Feet and inches (ft + in)</option></select>
<div id="cmBox"><label for="h">Height (cm)</label><input id="h" type="number" min="50" max="300" step="any" inputmode="decimal" placeholder="e.g. 165"></div>
<div id="ftBox" hidden><div class="grid"><div><label for="feet">Feet</label><input id="feet" type="number" min="1" max="9" step="1" inputmode="numeric" placeholder="e.g. 5"></div><div><label for="inch">Inches</label><input id="inch" type="number" min="0" max="11.99" step="any" inputmode="decimal" placeholder="e.g. 5"></div></div></div>
<button id="calculate" type="button">Calculate BMI</button><div id="r" class="result" hidden aria-live="polite"></div></div></main>
<script>
const unit=document.getElementById('unit'),cmBox=document.getElementById('cmBox'),ftBox=document.getElementById('ftBox'),result=document.getElementById('r');
unit.addEventListener('change',()=>{const feetMode=unit.value==='ft';cmBox.hidden=feetMode;ftBox.hidden=!feetMode;result.hidden=true});
function calc(){
 const w=Number(document.getElementById('w').value);let h;
 if(unit.value==='cm')h=Number(document.getElementById('h').value);
 else {const f=Number(document.getElementById('feet').value),i=Number(document.getElementById('inch').value||0);if(!Number.isFinite(f)||!Number.isFinite(i)||f<1||f>9||i<0||i>=12){result.hidden=false;result.textContent='Please enter valid feet and inches.';result.className='result error';return}h=(f*12+i)*2.54}
 result.hidden=false;result.className='result';
 if(!Number.isFinite(w)||!Number.isFinite(h)||w<=0||w>500||h<50||h>300){result.className='result error';result.textContent='Please enter a valid weight and height.';return}
 const bmi=w/((h/100)**2);const category=bmi<18.5?'Underweight':bmi<25?'Healthy range':bmi<30?'Overweight':'Obesity';
 result.innerHTML='<strong style="font-size:25px">BMI: '+bmi.toFixed(1)+'</strong><br>'+category+'<br><small>BMI is a screening measure, not a diagnosis. Adult BMI categories may not apply to children or teens.</small>';
}
document.getElementById('calculate').addEventListener('click',calc);
</script></body></html>
