<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salary Calculator — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:650px;margin:auto;padding:50px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:28px}.dark .box{background:#111621;border-color:#252c3d}input{width:100%;padding:13px;margin:6px 0 12px;border:1px solid #dfe2eb;border-radius:11px;background:transparent;color:inherit}button{padding:12px 18px;background:#6258ff;color:#fff;border:0;border-radius:11px;font-weight:800}.result{margin-top:20px;padding:20px;background:#f1f0ff;border-radius:15px}.dark .result{background:#1b1d38}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">CALCULATOR</span><h1>💰 Salary Calculator</h1><label>Monthly gross salary</label><input id="m" type="number" value="25000"><label>Monthly deductions</label><input id="d" type="number" value="0"><button onclick="calc()">Calculate</button><div id="result" class="result">—</div></div></main><script>function calc(){const M=Number(m.value),D=Number(d.value);if(M<0||D<0||D>M)return result.textContent='Enter valid deductions.';const net=M-D;result.innerHTML='<b>Net monthly: '+net.toLocaleString()+'</b><br>Annual gross: '+(M*12).toLocaleString()+'<br>Annual net: '+(net*12).toLocaleString()+'<br>Daily average: '+(net/30).toLocaleString(undefined,{maximumFractionDigits:2})}</script></body></html>
