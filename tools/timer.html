<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Countdown Timer — Everyday Tools</title><link rel="stylesheet" href="../style.css"><style>main{max-width:720px;margin:auto;padding:70px 20px}.box{background:#fff;border:1px solid #e2e5ed;border-radius:24px;padding:30px;text-align:center}.dark .box{background:#111621}.error{color:#c33}input{padding:14px;border:1px solid #dfe2eb;border-radius:12px;font:inherit;background:transparent;color:inherit;width:120px}button{padding:13px 20px;border:0;border-radius:12px;background:#6258ff;color:#fff;font-weight:800;margin:12px 5px}.clock{font-size:64px;font-weight:800;margin:25px}.back{color:#6258ff;text-decoration:none;font-weight:700}</style></head><body><main><a class="back" href="../index.html">← Back</a><div class="box"><span class="label">UTILITY</span><h1>⏱️ Countdown Timer</h1><p>Set a timer in minutes and seconds.</p><input id="mins" type="number" min="0" max="9999" value="5"> min <input id="secs" type="number" min="0" max="59" value="0"> sec<div id="clock" class="clock">05:00</div><button onclick="start()">Start</button><button onclick="reset()">Reset</button><div id="err" class="error"></div></div></main><script>let left=300,id;function draw(){clock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}function start(){clearInterval(id);const m=Number(mins.value),s=Number(secs.value);if(!Number.isInteger(m)||!Number.isInteger(s)||m<0||m>9999||s<0||s>59){err.textContent='Enter valid minutes and seconds.';return}left=m*60+s;if(left<=0){err.textContent='Set a time greater than zero.';return}err.textContent='';draw();id=setInterval(()=>{left--;draw();if(left<=0){clearInterval(id);left=0;draw()}},1000)}function reset(){clearInterval(id);left=0;draw();err.textContent=''}</script></body></html>
