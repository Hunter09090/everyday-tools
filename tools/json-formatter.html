<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Format and minify JSON in your browser."><title>JSON Formatter — Everyday Tools</title><link rel="stylesheet" href="../style.css"></head><body><main style="max-width:900px;margin:auto;padding:50px 20px"><a class="back" href="../index.html">← Back</a><div class="tool-page"><span class="label">TEXT</span><h1>{ } JSON Formatter</h1><textarea id="json" placeholder='{"name":"Everyday Tools","free":true}' style="width:100%;min-height:350px;padding:15px;border:1px solid #dfe2eb;border-radius:12px;background:transparent;color:inherit;font:14px monospace"></textarea><button onclick="formatJSON()">Format JSON</button><button onclick="minify()">Minify</button><p id="msg"></p></div></main><script>function formatJSON(){try{json.value=JSON.stringify(JSON.parse(json.value),null,2);msg.textContent='Valid JSON ✓';msg.className='ok'}catch(e){msg.textContent='Invalid JSON: '+e.message;msg.className='err'}}function minify(){try{json.value=JSON.stringify(JSON.parse(json.value));msg.textContent='Minified ✓';msg.className='ok'}catch(e){msg.textContent='Invalid JSON: '+e.message;msg.className='err'}}</script></body></html>
